name: fellow-travelers

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fellow}:${POSTGRES_PASSWORD:-fellow}@db:5432/${POSTGRES_DB:-fellow_travelers}
  BOT_TOKEN: ${BOT_TOKEN:-}
  BOT_USERNAME: ${BOT_USERNAME:-}
  INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS:-86400}
  DEBUG: ${DEBUG:-false}

x-backend: &backend
  build:
    context: ./backend
  image: fellow-travelers-backend:local
  environment: *backend-env

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fellow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fellow}
      POSTGRES_DB: ${POSTGRES_DB:-fellow_travelers}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fellow} -d ${POSTGRES_DB:-fellow_travelers}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.seeds.locations"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz").read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bot:
    <<: *backend
    command: ["python", "-m", "app.bot"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_BOT_USERNAME: ${BOT_USERNAME:-}
    image: fellow-travelers-web:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
