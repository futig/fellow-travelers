services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fellow
      POSTGRES_PASSWORD: fellow
      POSTGRES_DB: fellow_travelers
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fellow -d fellow_travelers"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fellow:fellow@db:5432/fellow_travelers
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  bot:
    build: .
    command: python -m app.bot
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://fellow:fellow@db:5432/fellow_travelers
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
