- name: Install repository prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, python3-apt]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Read installed packages
  ansible.builtin.package_facts:
    manager: auto

- name: Refuse to replace a conflicting Docker installation
  ansible.builtin.assert:
    that:
      - >-
        ['docker.io', 'docker-compose', 'docker-compose-v2', 'docker-buildx',
         'docker-doc', 'podman-docker', 'containerd', 'runc']
        | intersect(ansible_facts['packages'].keys() | list) | length == 0
    fail_msg: Conflicting Docker packages found. Use a fresh VM or migrate its Docker installation first.

- name: Create APT key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Configure the official Docker APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.sources
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.docker.com/linux/ubuntu
      Suites: {{ ansible_facts['distribution_release'] }}
      Components: stable
      Architectures: {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}
      Signed-By: /etc/apt/keyrings/docker.asc
  register: docker_repository

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: "{{ docker_repository.changed }}"
