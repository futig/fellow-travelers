version: "3.8"

x-rolling: &rolling
  replicas: 2
  update_config:
    parallelism: 1
    delay: 10s
    order: start-first
    monitor: 45s
    failure_action: rollback
    max_failure_ratio: 0
  rollback_config:
    parallelism: 1
    order: start-first
    monitor: 30s
    failure_action: pause
  restart_policy:
    condition: any
    delay: 5s

services:
  api:
    image: "${API_IMAGE}"
    labels:
      com.fellow-travelers.release: "${SECRETS_RELEASE}"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --timeout-graceful-shutdown 45
    environment:
      APP_SECRETS_DIR: /run/secrets
      BOT_USERNAME: "${BOT_USERNAME}"
      INIT_DATA_MAX_AGE_SECONDS: "${INIT_DATA_MAX_AGE_SECONDS}"
      DEBUG: "${DEBUG}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      WORKER_METRICS_PORT: "${WORKER_METRICS_PORT:-9100}"
    volumes:
      - /var/lib/fellow-travelers/secrets/${SECRETS_RELEASE}/api:/run/secrets:ro
    networks: [private]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=4).read()"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy: *rolling

  web:
    image: "${WEB_IMAGE}"
    labels:
      com.fellow-travelers.release: "${SECRETS_RELEASE}"
    volumes:
      - assets:/usr/share/nginx/html/assets:ro
    networks: [private]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy: *rolling

  bot:
    image: "${API_IMAGE}"
    labels:
      com.fellow-travelers.release: "${SECRETS_RELEASE}"
    command: python -m app.bot
    environment:
      APP_SECRETS_DIR: /run/secrets
      BOT_USERNAME: "${BOT_USERNAME}"
      TELEGRAM_RELAY_URL: "${TELEGRAM_RELAY_URL}"
      INIT_DATA_MAX_AGE_SECONDS: "${INIT_DATA_MAX_AGE_SECONDS}"
      DEBUG: "${DEBUG}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      WEB_APP_URL: "${SITE_ADDRESS}"
    volumes:
      - /var/lib/fellow-travelers/secrets/${SECRETS_RELEASE}/bot:/run/secrets:ro
    networks: [private]
    stop_grace_period: 60s
    deploy:
      <<: *rolling
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        monitor: 45s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s
        failure_action: pause

  worker:
    image: "${API_IMAGE}"
    labels:
      com.fellow-travelers.release: "${SECRETS_RELEASE}"
    command: python -m app.worker
    environment:
      APP_SECRETS_DIR: /run/secrets
      BOT_USERNAME: "${BOT_USERNAME}"
      INIT_DATA_MAX_AGE_SECONDS: "${INIT_DATA_MAX_AGE_SECONDS}"
      DEBUG: "${DEBUG}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      WORKER_METRICS_PORT: "${WORKER_METRICS_PORT:-9100}"
    volumes:
      - /var/lib/fellow-travelers/secrets/${SECRETS_RELEASE}/api:/run/secrets:ro
    networks: [private]
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python, -m, app.worker.healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      <<: *rolling
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
        monitor: 60s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 30s
        failure_action: pause

networks:
  private:
    external: true
    name: fellow-private

volumes:
  assets:
    external: true
    name: fellow-assets
