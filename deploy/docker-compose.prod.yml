version: '3.7'

services:
  db:
    container_name: db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fellow
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: fellow_travelers
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  api:
    container_name: api
    image: "${API_IMAGE}"
    command: >
      sh -c "alembic upgrade head
      && python -m app.seeds.locations
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://fellow:${POSTGRES_PASSWORD}@db:5432/fellow_travelers"
      BOT_TOKEN: "${BOT_TOKEN}"
      BOT_USERNAME: "${BOT_USERNAME}"
      INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS}
      DEBUG: "${DEBUG}"
    depends_on:
      - db
    restart: always

  bot:
    container_name: bot
    image: "${API_IMAGE}"
    command: python -m app.bot
    environment:
      DATABASE_URL: "postgresql+asyncpg://fellow:${POSTGRES_PASSWORD}@db:5432/fellow_travelers"
      BOT_TOKEN: "${BOT_TOKEN}"
      BOT_USERNAME: "${BOT_USERNAME}"
      INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS}
      DEBUG: "${DEBUG}"
    depends_on:
      - db
    restart: always

  web:
    container_name: web
    image: "${WEB_IMAGE}"
    depends_on:
      - api
    restart: always

  caddy:
    container_name: caddy
    image: "${CADDY_IMAGE}"
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS}"
      ACME_EMAIL: "${ACME_EMAIL}"
      ACME_CA: "${ACME_CA}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: always

  backup:
    container_name: backup
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump -h db -U fellow -d fellow_travelers | gzip > /backups/day$$(date +%u).sql.gz \
            && echo "backup done: day$$(date +%u)" \
            || echo "backup FAILED"
          sleep 86400
        done
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - backups:/backups
    depends_on:
      - db
    restart: always

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
