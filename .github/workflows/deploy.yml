name: Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что секреты заданы
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          YC_VM_ID: ${{ secrets.YC_VM_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
        run: |
          missing=""
          for name in YC_SA_KEY YC_FOLDER_ID YC_REGISTRY_ID YC_VM_ID \
                      BOT_TOKEN BOT_USERNAME POSTGRES_PASSWORD SITE_ADDRESS ACME_EMAIL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::не заданы секреты репозитория:$missing (см. docs/deploy.md, шаг 4)"
            exit 1
          fi
          case "$POSTGRES_PASSWORD" in
            *[!A-Za-z0-9]*)
              echo "::error::POSTGRES_PASSWORD должен состоять только из букв и цифр: он подставляется в DATABASE_URL"
              exit 1 ;;
          esac

      - name: Проверить Caddyfile
        run: |
          docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" \
            -e SITE_ADDRESS=":80" -e ACME_EMAIL="ci@example.com" \
            -e ACME_CA="https://acme-staging-v02.api.letsencrypt.org/directory" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - uses: docker/setup-buildx-action@v3

      - name: Установить yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"

      - name: Авторизоваться в Yandex Cloud и в реестре
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/sa-key.json"
          yc config set service-account-key "$RUNNER_TEMP/sa-key.json"
          yc config set folder-id "$YC_FOLDER_ID"
          yc iam create-token | docker login --username iam --password-stdin cr.yandex

      - name: Образ бэкенда (api и bot)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Образ мини-приложения
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          build-args: VITE_BOT_USERNAME=${{ secrets.BOT_USERNAME }}
          push: true
          tags: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Образ Caddy
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/caddy
          push: true
          tags: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/caddy:${{ github.sha }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Собрать спецификацию контейнеров
        env:
          API_IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/api:${{ github.sha }}
          WEB_IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/web:${{ github.sha }}
          CADDY_IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/caddy:${{ github.sha }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          ACME_CA: ${{ secrets.ACME_CA || 'https://acme-v02.api.letsencrypt.org/directory' }}
          INIT_DATA_MAX_AGE_SECONDS: ${{ secrets.INIT_DATA_MAX_AGE_SECONDS || '86400' }}
          DEBUG: ${{ secrets.DEBUG || 'false' }}
        run: |
          # список переменных явный: $$(date +%u) в сервисе backup подставлять нельзя
          envsubst '${API_IMAGE} ${WEB_IMAGE} ${CADDY_IMAGE} ${BOT_TOKEN} ${BOT_USERNAME}
                    ${POSTGRES_PASSWORD} ${SITE_ADDRESS} ${ACME_EMAIL} ${ACME_CA}
                    ${INIT_DATA_MAX_AGE_SECONDS} ${DEBUG}' \
            < deploy/docker-compose.prod.yml > "$RUNNER_TEMP/spec.yml"
          docker compose -f "$RUNNER_TEMP/spec.yml" config --quiet

      - name: Обновить контейнеры на ВМ
        env:
          YC_VM_ID: ${{ secrets.YC_VM_ID }}
        run: yc compute instance update-container "$YC_VM_ID" --docker-compose-file "$RUNNER_TEMP/spec.yml"

      - name: Проверить, что сайт отвечает
        continue-on-error: true
        env:
          YC_VM_ID: ${{ secrets.YC_VM_ID }}
        run: |
          ip=$(yc compute instance get --id "$YC_VM_ID" --format json \
            | jq -r '.network_interfaces[0].primary_v4_address.one_to_one_nat.address')
          echo "Публичный IP: $ip"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://$ip/" || true)
            if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
              echo "Ответ HTTP $code"; exit 0
            fi
            sleep 10
          done
          echo "::warning::сайт не ответил за 5 минут"
