name: Deploy

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - frontend/**
      - deploy/**
      - .github/workflows/deploy.yml
      - .github/scripts/**
  workflow_dispatch:
    inputs:
      action:
        description: Application deployment or rollback to the preceding successful release
        type: choice
        options: [deploy, rollback]
        default: deploy
      update_infra:
        description: Also update infrastructure (Caddy/config); may interrupt HTTPS briefly
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    if: inputs.action != 'rollback'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    if: always() && (needs.tests.result == 'success' || inputs.action == 'rollback')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Проверить, что секреты заданы
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
          YC_VM_ID: ${{ secrets.YC_VM_ID }}
          YC_VM_SSH_KEY: ${{ secrets.YC_VM_SSH_KEY }}
          YC_VM_SSH_KNOWN_HOSTS: ${{ secrets.YC_VM_SSH_KNOWN_HOSTS }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          SWARM_ACTION: ${{ inputs.action || 'deploy' }}
        run: |
          missing=""
          required="YC_SA_KEY YC_REGISTRY_ID YC_VM_ID YC_VM_SSH_KEY YC_VM_SSH_KNOWN_HOSTS"
          if [ "$SWARM_ACTION" != "rollback" ]; then
            required="$required BOT_TOKEN BOT_USERNAME POSTGRES_PASSWORD SITE_ADDRESS ACME_EMAIL"
          fi
          for name in $required; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::не заданы секреты репозитория:$missing"
            exit 1
          fi
          case "$POSTGRES_PASSWORD" in
            *[!A-Za-z0-9]*) echo "::error::POSTGRES_PASSWORD должен быть буквенно-цифровым"; exit 1 ;;
          esac

      - name: Проверить Telegram relay
        if: inputs.action != 'rollback'
        env:
          TELEGRAM_RELAY_URL: ${{ secrets.TELEGRAM_RELAY_URL }}
          TELEGRAM_RELAY_SECRET: ${{ secrets.TELEGRAM_RELAY_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python3 .github/scripts/check-telegram-relay.py

      - name: Проверить Caddyfile
        if: inputs.update_infra
        run: |
          docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro" \
            -e SITE_ADDRESS=":80" -e ACME_EMAIL="ci@example.com" \
            -e ACME_CA="https://acme-staging-v02.api.letsencrypt.org/directory" \
            caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: inputs.action != 'rollback'

      - name: Получить IAM-токен и войти в реестр
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          umask 077
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/sa-key.json"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes \
            -r .github/scripts/requirements.txt
          token=$(YC_KEY_FILE="$RUNNER_TEMP/sa-key.json" \
            "$RUNNER_TEMP/venv/bin/python" .github/scripts/yc-iam-token.py)
          echo "::add-mask::$token"
          echo "IAM_TOKEN=$token" >> "$GITHUB_ENV"
          printf '%s' "$token" | docker login --username iam --password-stdin cr.yandex

      - name: Образ бэкенда
        if: inputs.action != 'rollback'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          push: true
          tags: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/api:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Образ мини-приложения
        if: inputs.action != 'rollback'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          build-args: VITE_BOT_USERNAME=${{ secrets.BOT_USERNAME }}
          push: true
          tags: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/web:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Образ Caddy
        if: inputs.update_infra && inputs.action != 'rollback'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./deploy/caddy
          push: true
          tags: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/caddy:${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Настроить SSH к ВМ
        env:
          YC_VM_ID: ${{ secrets.YC_VM_ID }}
          YC_VM_SSH_KEY: ${{ secrets.YC_VM_SSH_KEY }}
          YC_VM_SSH_KNOWN_HOSTS: ${{ secrets.YC_VM_SSH_KNOWN_HOSTS }}
          SSH_USER: ${{ vars.YC_VM_SSH_USER || 'yc-user' }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/fellow-ssh"
          printf '%s\n' "$YC_VM_SSH_KEY" > "$RUNNER_TEMP/fellow-ssh/key"
          printf '%s\n' "$YC_VM_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/fellow-ssh/known_hosts"
          ip=$(curl -sS --fail -H "Authorization: Bearer $IAM_TOKEN" \
            "https://compute.api.cloud.yandex.net/compute/v1/instances/$YC_VM_ID" \
            | jq -er '.networkInterfaces[0].primaryV4Address.oneToOneNat.address')
          {
            echo "SSH_TARGET=$SSH_USER@$ip"
            echo "SSH_KEY_FILE=$RUNNER_TEMP/fellow-ssh/key"
            echo "SSH_KNOWN_HOSTS_FILE=$RUNNER_TEMP/fellow-ssh/known_hosts"
            echo "SECRETS_RELEASE=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"

      - id: upload_secrets
        name: Передать секреты на ВМ
        if: inputs.action != 'rollback'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_RELAY_SECRET: ${{ secrets.TELEGRAM_RELAY_SECRET }}
        run: python3 .github/scripts/upload-runtime-secrets.py

      - id: update_swarm
        name: Выполнить rolling update и проверить релиз
        env:
          SWARM_ACTION: ${{ inputs.action || 'deploy' }}
          UPDATE_INFRA: ${{ inputs.update_infra || 'false' }}
          API_IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/api:${{ github.sha }}
          WEB_IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/web:${{ github.sha }}
          CADDY_IMAGE: ${{ inputs.update_infra && format('cr.yandex/{0}/caddy:{1}', secrets.YC_REGISTRY_ID, github.sha) || '' }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          TELEGRAM_RELAY_URL: ${{ secrets.TELEGRAM_RELAY_URL }}
          SITE_ADDRESS: ${{ secrets.SITE_ADDRESS }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          ACME_CA: ${{ secrets.ACME_CA || 'https://acme-v02.api.letsencrypt.org/directory' }}
          INIT_DATA_MAX_AGE_SECONDS: ${{ secrets.INIT_DATA_MAX_AGE_SECONDS || '86400' }}
          DEBUG: ${{ secrets.DEBUG || 'false' }}
        run: python3 .github/scripts/run-swarm.py

      - name: Удалить временные учётные данные runner
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          shutil.rmtree(root / "fellow-ssh", ignore_errors=True)
          (root / "sa-key.json").unlink(missing_ok=True)
          PY

      - name: Вывести результат
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.update_swarm.outcome }}
        run: |
          {
            echo '## Rolling update'
            echo
            echo "Результат развёртывания и проверок: **$DEPLOY_OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"
