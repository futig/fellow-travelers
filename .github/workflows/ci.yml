name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fellow
          POSTGRES_PASSWORD: fellow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fellow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fellow:fellow@localhost:5432/fellow_travelers_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - id: pytest
        name: Run pytest
        run: pytest -q -W error
      - name: Вывести результат
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
        run: |
          {
            echo '## Backend pytest'
            echo
            echo "Результат тестов: **$PYTEST_OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - id: vitest
        name: Run Vitest
        run: npm test
      - name: Вывести результат
        if: always()
        env:
          VITEST_OUTCOME: ${{ steps.vitest.outcome }}
        run: |
          {
            echo '## Frontend Vitest'
            echo
            echo "Результат тестов: **$VITEST_OUTCOME**"
          } >> "$GITHUB_STEP_SUMMARY"
