# Защитные заголовки. add_header внутри location отменяет наследование с уровня server,
# поэтому файл подключается и в server, и в каждом location со своим add_header.
# img-src https: — домены photo_url Telegram заранее не известны.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
